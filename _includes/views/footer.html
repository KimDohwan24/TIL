<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="site-footer-inner">
      {%- assign currentYear = 'now' | date: "%Y" -%}
      {%- assign copyright = site.copyright
          | replace: '{currentYear}', currentYear
          | replace: '{author}', site.author
          | replace: '(c)', '&copy;'
          | replace: '(p)', '℗'
          | replace: '(cleft)', '<span class="copyleft">&copy;</span>'
      -%}
      <div>{{ copyright }}</div>
      <div><a title="Jekyll" href="https://jekyllrb.com/">Jekyll</a>과 <a title="Yat Theme" href="https://github.com/jeffreytse/jekyll-theme-yat">Yat Theme</a>로 만들었습니다.</div>
      <div class="footer-col rss-subscribe"><a href="{{ "/feed.xml" | relative_url }}">RSS 구독</a></div>
    </div>
  </div>
</footer>
