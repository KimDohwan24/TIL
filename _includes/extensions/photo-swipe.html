<script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.3/photoswipe.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.3/photoswipe-ui-default.min.js"></script>
<script>
  function initPhotoSwipe() {
    if (!window.PhotoSwipe || !window.PhotoSwipeUI_Default) return;

    var content = document.querySelector('.post-content');
    if (!content) return;

    var imageElements = content.querySelectorAll('img:not(.emoji)');
    if (!imageElements.length) return;

    imageElements.forEach(function (image) {
      if (image.parentElement.classList.contains('photo-swipe')) return;

      var link = document.createElement('a');
      link.className = 'photo-swipe';
      link.href = image.currentSrc || image.src;
      link.dataset.width = image.naturalWidth || image.width;
      link.dataset.height = image.naturalHeight || image.height;
      link.dataset.caption = image.getAttribute('caption') || image.alt || '';
      link.target = '_blank';
      link.rel = 'noopener';

      image.parentNode.insertBefore(link, image);
      link.appendChild(image);
    });

    var links = content.querySelectorAll('a.photo-swipe');
    var items = Array.prototype.map.call(links, function (link) {
      return {
        src: link.href,
        w: Number(link.dataset.width),
        h: Number(link.dataset.height),
        title: link.dataset.caption
      };
    });

    links.forEach(function (link, index) {
      link.addEventListener('click', function (event) {
        event.preventDefault();

        var gallery = new window.PhotoSwipe(
          document.querySelector('.pswp'),
          window.PhotoSwipeUI_Default,
          items,
          {
            index: index,
            bgOpacity: 0.85,
            showHideOpacity: true,
            closeOnScroll: true,
            maxSpreadZoom: 1
          }
        );

        gallery.init();
      });
    });
  }

  window.addEventListener('load', initPhotoSwipe);
</script>

<div class="pswp" tabindex="-1" role="dialog" aria-hidden="true" aria-label="이미지 크게 보기">
  <div class="pswp__bg"></div>
  <div class="pswp__scroll-wrap">
    <div class="pswp__container">
      <div class="pswp__item"></div>
      <div class="pswp__item"></div>
      <div class="pswp__item"></div>
    </div>
    <div class="pswp__ui pswp__ui--hidden">
      <div class="pswp__top-bar">
        <div class="pswp__counter"></div>
        <button class="pswp__button pswp__button--close" title="닫기"></button>
        <button class="pswp__button pswp__button--share" title="공유"></button>
        <button class="pswp__button pswp__button--fs" title="전체 화면"></button>
        <button class="pswp__button pswp__button--zoom" title="확대/축소"></button>
        <div class="pswp__preloader"><div class="pswp__preloader__icn"><div class="pswp__preloader__cut"><div class="pswp__preloader__donut"></div></div></div></div>
      </div>
      <div class="pswp__share-modal pswp__share-modal--hidden pswp__single-tap"><div class="pswp__share-tooltip"></div></div>
      <button class="pswp__button pswp__button--arrow--left" title="이전 이미지"></button>
      <button class="pswp__button pswp__button--arrow--right" title="다음 이미지"></button>
      <div class="pswp__caption"><div class="pswp__caption__center"></div></div>
    </div>
  </div>
</div>
