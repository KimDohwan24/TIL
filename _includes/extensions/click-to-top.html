<button id="click-to-top" class="click-to-top" type="button" aria-label="페이지 상단으로 이동">
  <i class="fa fa-arrow-up" aria-hidden="true"></i>
</button>
<script>
  (function () {
    var clickToTop = document.getElementById('click-to-top');
    if (!clickToTop) return;

    window.addEventListener('scroll', function () {
      clickToTop.classList.toggle('show', window.scrollY > 100);
    }, { passive: true });

    clickToTop.addEventListener('click', function () {
      window.smoothScrollTo(0);
    });
  })();
</script>
