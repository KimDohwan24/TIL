title: "DoHwan's Study Room"
author: "김도환"
email: ehghks18@gmail.com
description: "백엔드와 프론트엔드를 공부하며 기록하는 김도환의 개발 학습 노트입니다."
lang: ko-KR
timezone: Asia/Seoul

url: "https://kimdohwan24.github.io"
baseurl: "/TIL"
favicon: "/assets/images/favicon.svg"
logo: "/assets/images/favicon.svg"
image: "/assets/images/banners/home.jpeg"

social:
  name: "김도환"
  links:
    - "https://github.com/KimDohwan24"

copyright: "© 2025-{currentYear} {author}"

# 새 글의 게시일을 미래 날짜로 작성하는 현재 작성 방식과 호환하기 위해 유지합니다.
future: true

# 테마 설정
yat:
  date_format: "%Y년 %m월 %d일"

night_mode: "manual"
header_pages:
  - index.html
  - archives.html
  - categories.html
  - tags.html
  - about.html

# 기본 번역 위젯은 불필요한 외부 요청과 메뉴 복잡도를 줄이기 위해 비활성화합니다.
# 다시 사용하려면 필요한 언어 목록을 여기에 설정하세요.
translate_langs: []

# 홈 화면에는 최신 글만 보여 주고, 전체 글은 아카이브에서 확인합니다.
paginate: 10
paginate_path: "/page:num/"

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-spaceship
