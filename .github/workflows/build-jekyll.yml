name: Deploy Jekyll site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# gh-pages 브랜치에 결과물을 push해야 하므로 contents: write 권한이 필요합니다.
permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile.lock', 'Gemfile', 'jekyll-theme-yat.gemspec') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      # SHA로 고정해 외부 액션의 master 변경이 배포에 즉시 반영되지 않게 합니다.
      - uses: jeffreytse/jekyll-deploy-action@222a6b06c846416d654db18142eab0da528cdb4f
        with:
          provider: github
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          jekyll_src: ./
          jekyll_cfg: _config.yml
          jekyll_baseurl: /TIL
